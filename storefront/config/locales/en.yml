      continue: Continue shopping
      empty: Your cart is empty.
      start_shopping: Start shopping
      free_shipping: Free shipping
      remove_code: Remove
      discount_code: Discount code
      apply: Apply
    discounts:
      rate_limited: Too many tries. Please wait a minute.
      create:
        notice: Discount applied.
  cart_items:
    create:
      added: "%{product} was added to your cart."
      unavailable: That option isn't available any more.
  checkouts:
    empty: Your cart is empty.
    rate_limited: Too many tries. Wait a minute and try again.
    new:
      title: Checkout
      contact: Contact
      email_hint: For your order confirmation and shipping updates.
      phone_hint: Optional, for the delivery driver.
      phone_required_hint: The carrier needs it to deliver your order.
      choose_region: Choose…
      shipping: Shipping address
      summary: Order summary
      subtotal: Subtotal
      shipping_cost: Shipping
      shipping_from_address: Enter your address
      total_before_shipping: "%{total} + shipping"
      continue_to_payment: Continue to payment
      free: Free
      total: Total
      place_order: Place order
      pay: Pay %{total}
      secure: Payment is secure and encrypted. We never see your card.
      payment: Payment
      methods:
        stripe: Card
        stripe_hint: Pay securely with your card, Apple Pay or Google Pay on the next page.
        manual: Bank transfer or other
        manual_hint: After placing the order you'll see how to pay.
      agreement_html: By placing your order you agree to our %{policies}.
      discount: Discount (%{code})
      tax_at_payment: Tax, if any, is added on the payment page.
  policies:
    titles:
      refund: Refund policy
      shipping: Shipping policy
      privacy: Privacy policy
      terms: Terms of service
    updated: Last updated %{date}
    shipping_summary:
      free: Shipping is free on every order.
      rates: Shipping is %{first} for the first item and %{additional} for each additional item.
      free_from: Orders of %{amount} or more ship free.
  contacts:
    show:
      title: Contact
      intro: Questions about an order, sizing or anything else? We're happy to help.
      email: Email
      phone: Phone
      address: Address
      order_hint: About an order? Include your order number so we can help faster.
      form_title: Send us a message
      form_email: Your email
      form_message: Message
      form_send: Send
  order_lookups:
    rate_limited: Too many tries. Wait a few minutes and try again.
    new:
      title: Find my order
      intro: Enter the email you ordered with. We'll send you a link to your orders.
      email: Email
      send: Email me a link
    sent:
      title: Check your email
      body: If %{email} has orders with us, a link to them is on its way. It works for a day.
      body_no_email: If that email has orders with us, a link to them is on its way. It works for a day.
      spam: Nothing after a few minutes? Check your spam folder, or try the email you ordered with.
      again: Try another email
    show:
      title: Your orders
      intro: Orders placed with %{email}.
      none: No orders yet.
      items:
        one: 1 item
        other: "%{count} items"
      view: View order
    expired:
      title: This link has expired
      body: Links to your orders work for a day. Ask for a new one below.
  form_submissions:
    rate_limited: Too many messages. Wait a minute and try again.
    create:
      sent: Thanks! We've got your message and will write back soon.
  layouts:
    site:
      shop: Shop
      cart_with_count:
        zero: Cart
        one: Cart, 1 item
        other: Cart, %{count} items
      footer_navigation: Shop information
  ui:
    menu: Menu
    close: Close
    skip: Skip to content
    navigation: Navigation
    breadcrumbs: Breadcrumb
    form_errors:
      heading:
        one: '1 problem to fix:'
        other: "%{count} problems to fix:"
    pagination:
      label: Pages
      previous: Previous
      next: Next
      page: Page %{number} of %{pages}
  activemodel:
    attributes:
      checkout_form:
        email: Email
        phone: Phone
        shipping_name: Full name
        shipping_address1: Address
        shipping_address2: Apartment, suite, etc. (optional)
        shipping_city: City
        shipping_region: State / province
        shipping_postal_code: ZIP / postal code
        shipping_country: Country
        note: Note for the shop (optional)
        payment_method: Payment
