[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appbuilder-commerce"
version = "0.1.0"
description = "StorefrontBackend and MerchantBackend for anthropics/commerce-agents over an AppBuilder shop's agent API."
requires-python = ">=3.11"
license = { text = "MIT" }
# shopping-agent and merchant-agent come from the commerce-agents repository (they aren't on
# the package index): install them from its checkout first, see README.md.
dependencies = ["httpx>=0.27", "shopping-agent-core", "merchant-agent-core"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["appbuilder_commerce"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
