production:
  clear_abandoned_carts:
    class: Cart::CleanupJob
    schedule: every day at 4am
  expire_unpaid_card_orders:
    class: Order::ExpireUnpaidCardJob
    schedule: every hour at minute 25
  track_printify_shipments:
    class: Order::TrackShipmentsJob
    schedule: every hour at minute 40
  request_reviews:
    class: Order::RequestReviewsJob
    schedule: every day at 10am
  start_and_end_sales:
    class: Promotion::SyncJob
    schedule: every 5 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
