<% address = { shipping_address1: "1 Main St", shipping_city: "Portland", shipping_region: "OR", shipping_postal_code: "97201", shipping_country: "US", currency: "USD" } %>

pending:
  number: 1001
  token: pendingtoken000000000000000000001
  status: pending
  email: pat@example.com
  shipping_name: Pat Buyer
  subtotal_cents: 2400
  shipping_cents: 500
  total_cents: 2900
  <% address.each do |key, value| %><%= key %>: <%= value %>
  <% end %>

paid:
  number: 1002
  token: paidtoken0000000000000000000000002
