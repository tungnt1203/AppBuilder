# PostgreSQL: the platform keeps every shop's data, and the builder's, in one database
# (docs/platform-v1.md). Solid Queue, Cache and Cable have databases of their own on the same
# server. In development it's the platform-postgres container (see README); DATABASE_HOST,
# DATABASE_USERNAME and DATABASE_PASSWORD point elsewhere.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "platform") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "platform") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # libpq's GSSAPI check crashes processes forked on macOS (Solid Queue's workers); no
  # Kerberos here anyway.
  gssencmode: disable

# Jobs run in their own process (bin/jobs) and reach the browser through Solid Cable,
# so a restart of the web server doesn't interrupt the agent.
development:
  primary:
    <<: *default
    database: platform_development
  queue:
    <<: *default
    database: platform_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: platform_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: platform_test

production:
  primary: &primary_production
    <<: *default
    database: platform_production
  cache:
    <<: *primary_production
    database: platform_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: platform_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: platform_production_cable
    migrations_paths: db/cable_migrate
