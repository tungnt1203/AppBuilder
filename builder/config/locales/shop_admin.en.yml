            also send updates (late payments, refunds made in Stripe).
          webhook_moved: The shop's address changed, so Stripe can't send payment
            updates here yet.
          webhook_register: Send updates to this address
          disconnect: Disconnect Stripe
          confirm_disconnect: Disconnect Stripe? Buyers won't be able to pay by card
