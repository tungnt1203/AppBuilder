# The shop core's own text: model names and errors, payment messages and the order emails.
# An app changes any of it by setting the same key in its own config/locales.
en:
  activerecord:
    models:
      product: Product
      variant: Variant
      collection: Collection
      order: Order
      store: Store
      discount: Discount code
      promotion: Sale
      product_review: Review
    attributes:
      product:
        title: Title
        description: Description
        size_guide: Size guide
        status: Status
        slug: Web address
        base_price: Price
        images: Photos
        option1_name: Option 1
        option2_name: Option 2
        option3_name: Option 3
        option1_values: Values of option 1
        option2_values: Values of option 2
        option3_values: Values of option 3
      variant:
        price: Price
        compare_at_price: Compare-at price
        sku: SKU
        available: For sale
        cost: Cost
        track_inventory: Track stock
        inventory_quantity: In stock
      collection:
        title: Title
        description: Description
        slug: Web address
        position: Position
      order:
        email: Email
        phone: Phone
        shipping_name: Full name
        shipping_address1: Address
        shipping_address2: Apartment, suite, etc.
        shipping_city: City
        shipping_region: State / province
        shipping_postal_code: ZIP / postal code
        shipping_country: Country
        note: Note for the order
        staff_note: Staff note
        tracking_url: Tracking link
      store:
        currency: Currency
        contact_email: Contact email
        shipping_first_item: Shipping, first item
        shipping_additional_item: Shipping, each additional item
        free_shipping_threshold: Free shipping from
        ship_to_countries: Countries you ship to
        payment_instructions: Payment instructions
        manual_payments: Accept manual payment
        contact_phone: Phone
        business_address: Business address
        refund_policy: Refund policy
        shipping_policy: Shipping policy
        privacy_policy: Privacy policy
        terms_of_service: Terms of service
        low_stock_threshold: Low stock from
        stripe_tax: Let Stripe calculate tax
        announcement: Announcement
        delivery_days_min: Delivery, fastest (business days)
        delivery_days_max: Delivery, slowest (business days)
        meta_pixel_id: Meta Pixel ID
        meta_access_token: Meta Conversions API access token
        meta_test_event_code: Meta test event code
        tiktok_pixel_id: TikTok Pixel ID
        google_tag_id: Google tag ID
      discount:
        code: Code
        kind: Type
        percent_off: Percent off
        amount_off: Amount off
        minimum_subtotal: Minimum order
        starts_at: Starts
        ends_at: Ends
        usage_limit: Uses allowed
        times_used: Used
        active: Active
      promotion:
        name: Name
        percent_off: Percent off
        starts_at: Starts
        ends_at: Ends
        variant_ids: Products
      page:
        title: Title
        body: Text
        slug: Web address
      menu:
        title: Title
        key: Key
      form:
        title: Title
        key: Key
      ad_spend:
        date: Day
        source: Where
        amount: Spent
      product_review:
        rating: Rating
        body: Review
        author_name: Name shown
    errors:
      models:
        product:
          attributes:
            base:
              options_in_order: Fill in the options in order, starting with option 1
              too_many_variants: These options make more than %{count} variants; use fewer values
              custom_field_number: "%{label} must be a whole number"
              custom_field_long: "%{label} is too long"
            images:
              not_an_image: "%{name} isn't an image"
        page:
          attributes:
            base:
              empty: Add some text or a question
        menu:
          attributes:
            base:
              empty: Add a link
              blank_item: Each link needs a label and an address
              bad_url: "%{url} needs to be a path like /pages/about or a full https address"
        form:
          attributes:
            base:
              empty: Add a field
        variant:
          attributes:
            base:
              taken: This combination of options already exists
        store:
          attributes:
            ship_to_countries:
              unknown: 'has codes we don''t know: %{codes}'
            stripe_publishable_key:
              not_a_publishable_key: should start with pk_live_ or pk_test_
              other_mode: is for the other mode than the secret key (one is a test key, the other live)
        discount:
          attributes:
            code:
              letters_and_numbers: can only have letters, numbers, dashes and underscores
            ends_at:
              before_start: must be after the start
        promotion:
          attributes:
            ends_at:
              before_start: must be after the start
            base:
              no_items: Choose at least one product
              overlaps: "%{product} is already in another sale at that time"
        ad_spend:
          attributes:
            date:
              in_future: can't be a day still to come
            source:
              invalid: is a name like facebook, tiktok or newsletter
        product_review:
          attributes:
            product:
              not_bought: isn't in this order
            product_id:
              taken: is already reviewed for this order
  activemodel:
    errors:
      models:
        checkout:
          attributes:
            base:
              empty_cart: Your cart is empty
              out_of_stock:
                one: Only 1 of %{product} is left; change the quantity in your cart
                other: Only %{count} of %{product} are left; change the quantity in your cart
                zero: "%{product} just sold out; remove it from your cart"
              discount_used_up: That discount code was just used up; remove it from your cart
              buyer_inputs: Check what you typed for %{product}
            shipping_country:
              not_shipped_to: isn't a country we ship to
            shipping_region:
              not_a_region: isn't one we know; pick it from the list
  order_mailer:
    summary:
      subtotal: Subtotal
      shipping: Shipping
      total: Total
      ship_to: Shipping to
      discount: Discount (%{code})
      tax: Tax
    confirmation:
      subject: "%{app}: order %{number} confirmed"
      heading: Thank you, %{name}!
      intro: We've received your order %{number}.
      payment: How to pay
      payment_by_email: We'll email you how to pay. Your order goes into production once the payment is in.
      view: View your order
    shipped:
      subject: "%{app}: order %{number} is on its way"
      heading: Order %{number} has shipped
      intro: Your order is on its way.
      tracking: Tracking
      track: Track your package
      view: View your order
    cancelled:
      subject: "%{app}: order %{number} is cancelled"
      heading: Order %{number} is cancelled
      intro: Your order is cancelled and won't be sent. If you paid for it, the shop will refund you.
      intro_refunded: Your order is cancelled and won't be sent. We've refunded %{total} to your card; it can take 5 to 10 days to show.
      questions: Questions? Write to %{email}.
      view: View your order
    recovery:
      subject: "%{app}: your order is waiting for you"
      heading: Still want it, %{name}?
      intro: You left before paying, so we kept your order for you. It's here whenever you're ready, for the next day.
      finish: Finish your order (%{total})
      questions: Questions? Write to %{email}.
    lookup:
      subject: "%{app}: your orders"
      heading: Your orders at %{app}
      intro: Here's the link to your orders, as you asked. It works for a day.
      view: See your orders
      not_you: Didn't ask for this? You can ignore this email.
    review_request:
      subject: "%{app}: how do you like it?"
      heading: How do you like it, %{name}?
      intro: Your order should have arrived by now. Would you take a minute to say what you think? It helps other buyers, and it helps us.
      review: Write a review
      problem: Something wrong with your order? Reply to this email and we'll make it right.
    refunded:
      subject: "%{app}: order %{number} is refunded"
      heading: Order %{number} is refunded
      intro: We've refunded %{total}. It can take a few days to show on your statement.
      questions: Questions? Write to %{email}.
      view: View your order
  orders:
    stripe_not_connected: Card payments aren't available right now. Please contact the shop.
    payment_not_started: We couldn't open the payment page. Please try again in a moment.
    printify_cancelled: Printify cancelled it. Check why in Printify, then ship it another way or cancel and refund it here.
    printify_not_cancelled: "Printify didn't cancel it (%{error}). It may be printing already: cancel it in Printify if you can, so you aren't charged for it."
    printify_stuck:
      has-issues: Printify has a problem with this order. Open it in Printify to see what it needs.
      unfulfillable: Printify can't make this order. Open it in Printify to see why, then refund the buyer here.
      payment-not-received: Printify is waiting for your payment for this order. Add funds or a card in Printify.
  admin:
    order_mailer:
      placed:
        subject: New order %{number} (%{total})
        intro: New order %{number} from %{name} (%{email}).
        open: Open the order
    form_mailer:
      submission:
        subject: New message — %{title}
        intro: Someone sent a message through %{title}.
    stripe_connections:
      wrong_key: That doesn't look like a Stripe secret key. It starts with sk_live_, sk_test_, rk_live_ or rk_test_.
      wrong_publishable_key: "The publishable key should start with pk_live_ or pk_test_, in the same mode as the secret key"
  discounts:
    problems:
      unknown: That code doesn't exist
      expired: That code has expired
      not_started: That code isn't valid yet
      used_up: That code has been used up
      below_minimum: That code needs a bigger order
  agent_api:
    fulfillment:
      eta: Ships to %{countries}; see the shipping policy for times
      anywhere: most countries
      free_from: Free shipping on orders from %{amount}
    contact: Contact
    claim_expired: That cart link has expired. Ask the assistant for a new one.
