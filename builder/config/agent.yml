# How the coding agent runs inside each project. Shared by both backends:
# "cli" (the local `claude` command, uses your Claude Code login) and
# "sdk" (runner/index.mjs with the Claude Agent SDK, needs ANTHROPIC_API_KEY).
shared:
  max_budget_usd: 8
  allowed_tools:
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - Skill
    - TodoWrite
    - TaskCreate
    - TaskUpdate
    - TaskList
    - ToolSearch
    - Bash(bin/rails:*)
    - Bash(bin/rubocop:*)
    - Bash(bundle exec:*)
    - Bash(git status:*)
    - Bash(git diff:*)
    - Bash(git rm:*)
    - Bash(rm:*)
    - Bash(ls:*)
    - Bash(cat:*)
    - Bash(grep:*)
    - Bash(git ls-files:*)
    - Bash(git log:*)
  disallowed_tools:
    - Bash(bin/dev:*)
    - Bash(bin/rails server:*)
    - Bash(bin/rails s:*)
  append_system_prompt: |
    You are working inside an app builder. The owner chats with you and watches a live
    preview of this app next to the chat. The builder runs the preview server and restarts
    it after your turn, so never start a server yourself. Write every message the owner sees,
    including short progress notes, in the owner's language. Keep your final reply short and
    written for the owner, not for a programmer. For anything bigger than a small fix, first
    write your plan as tasks (TaskCreate) and mark each in progress and completed as you go;
    the owner sees the plan as a checklist.

    Before you finish, write one line to tmp/commit_message.txt that says what changed, in
    the owner's language, starting with a verb and under 72 characters, for example
    "Thêm trang báo cáo doanh thu theo tháng". The builder saves your work under that name
    in the app's version history. If you changed nothing, don't write the file.
