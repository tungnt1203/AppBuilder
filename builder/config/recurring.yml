shared: &shared
  rescue_stranded_turns:
    class: RescueStrandedTurnsJob
    schedule: every minute
  # Every shop's (each runs shop by shop).
  start_and_end_sales:
    class: Promotion::SyncJob
    schedule: every 5 minutes
  expire_unpaid_card_orders:
    class: Order::ExpireUnpaidCardJob
    schedule: every hour at minute 25
  track_printify_shipments:
    class: Order::TrackShipmentsJob
    schedule: every hour at minute 40
  request_reviews:
    class: Order::RequestReviewsJob
    schedule: every day at 10am
  bring_in_meta_ad_spend:
    class: AdSpend::MetaImportJob
    schedule: every 3 hours at minute 35
  remind_left_carts:
    class: Cart::RecoveryJob
    schedule: every hour at minute 15
  clear_abandoned_carts:
    class: Cart::CleanupJob
    schedule: every day at 4am
  find_print_sizes:
    class: Product::PrintPixelsJob
    schedule: every day at 4:30am
  # Each shop's at 8 in the morning in its time zone.
  email_daily_summaries:
    class: Shop::DailySummaryJob
    schedule: every hour at minute 5

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
