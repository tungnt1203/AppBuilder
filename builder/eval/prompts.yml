    evenings or Saturday mornings only, return Sunday or Monday). I need to approve
    each request, see a calendar of what''s out, and mark gear as damaged or in repair
    so it can''t be booked. Each item has a daily price and a deposit amount shown,
    both handled in cash at pickup. It should have a rugged, topographic-map look:
    contour lines in the background, muted greens and rust, stencil-style headings,
    maybe a ''trail log'' feel on the booking page. Customers need to sign in so I
    can see their past rentals and flag anyone who returned something late.'
